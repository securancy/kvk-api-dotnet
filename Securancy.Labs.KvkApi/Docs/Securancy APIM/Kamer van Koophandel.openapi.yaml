openapi: 3.0.1
info:
  title: Kamer van Koophandel
  description: Documentatie voor API Zoeken.
  version: v3
servers:
  - url: https://api.securancy.io/services/kvk/v3
paths:
  /v2/zoeken:
    get:
      tags:
        - Zoeken
      summary: Voor een bedrijf zoeken naar basisinformatie.
      description: Er wordt max. 1000 resultaten getoond.
      operationId: get-results
      parameters:
        - name: kvkNummer
          in: query
          description: Nederlands Kamer van Koophandel nummer dat bestaat uit 8 cijfers
          schema:
            pattern: '^[0-9]{8}$'
            type: string
          example: 59581883
        - name: rsin
          in: query
          description: Rechtspersonen Samenwerkingsverbanden Informatie Nummer dat bestaat uit 9 cijfers
          schema:
            pattern: '^[0-9]{9}$'
            type: string
          example: 823807071
        - name: vestigingsnummer
          in: query
          description: Vestigingsnummer dat bestaat uit 12 cijfers
          schema:
            pattern: '^[0-9]{12}$'
            type: string
          example: 15063097
        - name: naam
          in: query
          description: De naam waaronder een vestiging of rechtspersoon handelt
          schema:
            type: string
          example: Kamer van Koophandel
        - name: straatnaam
          in: query
          schema:
            type: string
          example: St.-Jacobsstraat
        - name: plaats
          in: query
          schema:
            type: string
          example: Utrecht
        - name: postcode
          in: query
          description: Mag alleen in combinatie met huisnummer of postbusnummer gezocht worden
          schema:
            pattern: '^[0-9]{4}[a-z,A-Z]{2}$'
            type: string
          example: 3511BT
        - name: huisnummer
          in: query
          description: Mag alleen in combinatie met postcode gezocht worden
          schema:
            pattern: '^[0-9]{1,5}$'
            type: integer
          example: 300
        - name: huisletter
          in: query
          description: Optioneel. Alleen in combinatie met huisnummer
          schema:
            pattern: '^[a-z,A-Z]{1}$'
            type: string
          example: D
        - name: postbusnummer
          in: query
          description: Mag alleen in combinatie met postcode gezocht worden
          schema:
            pattern: '^[0-9]{1,5}$'
            type: integer
          example: 9292
        - name: type
          in: query
          description: 'Filter op type: hoofdvestiging, nevenvestiging en/of rechtspersoon'
          schema:
            type: array
            items:
              enum:
                - hoofdvestiging
                - nevenvestiging
                - rechtspersoon
              type: string
          example: hoofdvestiging
        - name: inclusiefInactieveRegistraties
          in: query
          description: Inclusief inactieve registraties
          schema:
            type: boolean
          example: 'True'
        - name: pagina
          in: query
          description: 'Paginanummer, minimaal 1 en maximaal 1000'
          schema:
            maximum: 1000.0
            type: integer
            default: 1
        - name: resultatenPerPagina
          in: query
          description: 'Kies het aantal resultaten per pagina, minimaal 1 en maximaal 100'
          schema:
            maximum: 100.0
            minimum: 1.0
            type: integer
            default: 10
      responses:
        '200':
          description: OK
          headers:
            api-version:
              schema:
                type: string
            warning:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultaat'
              example:
                pagina: 0
                resultatenPerPagina: 0
                totaal: 0
                vorige: string
                volgende: string
                resultaten:
                  - kvkNummer: string
                    rsin: string
                    vestigingsnummer: string
                    naam: string
                    adres:
                      binnenlandsAdres:
                        type: bezoekadres
                        straatnaam: string
                        huisnummer: 0
                        huisletter: string
                        postbusnummer: 0
                        postcode: string
                        plaats: string
                      buitenlandsAdres:
                        type: bezoekadres
                        straatHuisnummer: 53 Rue de Tilsitt
                        postcodeWoonplaats: X-13501 Parijs
                        land: Frankrijk
                    type: string
                    actief: string
                    vervallenNaam: string
                    _links: { }
                _links: { }
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Resultaat'
              example:
                pagina: 0
                resultatenPerPagina: 0
                totaal: 0
                vorige: string
                volgende: string
                resultaten:
                  - kvkNummer: string
                    rsin: string
                    vestigingsnummer: string
                    naam: string
                    adres:
                      binnenlandsAdres:
                        type: bezoekadres
                        straatnaam: string
                        huisnummer: 0
                        huisletter: string
                        postbusnummer: 0
                        postcode: string
                        plaats: string
                      buitenlandsAdres:
                        type: bezoekadres
                        straatHuisnummer: 53 Rue de Tilsitt
                        postcodeWoonplaats: X-13501 Parijs
                        land: Frankrijk
                    type: string
                    actief: string
                    vervallenNaam: string
                    _links: { }
                _links: { }
        '400':
          description: Een opgegeven parameter is niet valide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
        '401':
          description: Geen of onjuiste apikey aangeleverd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
        '403':
          description: Niet geautoriseerd voor deze operatie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
        '404':
          description: Er zijn geen resultaten gevonden aan de hand van de opgegeven parameter(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
        '406':
          description: Opgegeven Accept header wordt niet ondersteund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
        '500':
          description: Er is een interne fout opgetreden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
            application/hal+json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fout:
                  - code: string
                    omschrijving: string
