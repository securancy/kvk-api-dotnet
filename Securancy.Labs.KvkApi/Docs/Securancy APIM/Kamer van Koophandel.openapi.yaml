components:
  schemas:
    Adres:
      type: object
      properties:
        binnenlandsAdres:
          $ref: '#/components/schemas/BinnenlandsAdres'
        buitenlandsAdres:
          $ref: '#/components/schemas/BuitenlandsAdres'
      description: Binnenlands of buitenlands adres
    AdresType:
      enum:
        - bezoekadres
        - postadres
      type: string
      description: Bezoekadres of postadres
    BinnenlandsAdres:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AdresType'
        straatnaam:
          type: string
        huisnummer:
          type: integer
          format: int32
        huisletter:
          type: string
        postbusnummer:
          type: integer
          description: Postbusnummer wordt alleen getoond indien het een postadres betreft
          format: int32
        postcode:
          type: string
        plaats:
          type: string
    BuitenlandsAdres:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AdresType'
        straatHuisnummer:
          type: string
          description: Het straat/huisnummer is een combinatie van de straat en huisnummer
          example: 53 Rue de Tilsitt
        postcodeWoonplaats:
          type: string
          description: De postcode/woonplaats is de combinatie van een eventuele postcode en woonplaats
          example: X-13501 Parijs
        land:
          type: string
          description: De naam van het land waar het adres bevindt
          example: Frankrijk
    Links:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Link'
    Resultaat:
      type: object
      properties:
        pagina:
          type: integer
          description: Geeft aan op welke pagina je bent. Start vanaf pagina 1
          format: int32
        resultatenPerPagina:
          type: integer
          description: Geeft het aantal zoek resultaten per pagina weer
          format: int32
        totaal:
          type: integer
          description: Totaal aantal zoekresultaten gevonden. De API Zoeken toont max. 1000 resultaten.
          format: int32
        vorige:
          type: string
          description: Link naar de vorige pagina indien beschikbaar
        volgende:
          type: string
          description: Link naar de volgende pagina indien beschikbaar
        resultaten:
          type: array
          items:
            $ref: '#/components/schemas/ResultaatItem'
        _links:
          $ref: '#/components/schemas/Links'
    ResultaatItem:
      type: object
      properties:
        kvkNummer:
          type: string
          description: Nederlands Kamer van Koophandel nummer dat bestaat uit 8 cijfers
        rsin:
          type: string
          description: Rechtspersonen Samenwerkingsverbanden Informatie Nummer dat bestaat uit 9 cijfers
        vestigingsnummer:
          type: string
          description: Vestigingsnummer dat bestaat uit 12 cijfers
        naam:
          type: string
          description: De naam waaronder een vestiging of rechtspersoon handelt
        adres:
          $ref: '#/components/schemas/Adres'
        type:
          type: string
          description: hoofdvestiging/nevenvestiging/rechtspersoon
        actief:
          type: string
          description: Indicatie of inschrijving actief is
        vervallenNaam:
          type: string
          description: Bevat de vervallen naam waaronder een vestiging of rechtspersoon heeft gehandeld
        _links:
          $ref: '#/components/schemas/Links'
    Link:
      type: object
      properties:
        href:
          type: string
        title:
          type: string
    Error:
      type: object
      properties:
        fout:
          type: array
          items:
            $ref: '#/components/schemas/Fout'
    Fout:
      type: object
      properties:
        code:
          type: string
          description: Foutcode
        omschrijving:
          type: string
          description: Omschrijving van de foutmelding
    VestigingAdres:
      type: object
      properties:
        type:
          type: string
          description: Correspondentieadres en/of bezoekadres
        indAfgeschermd:
          type: string
          description: Indicatie of het adres is afgeschermd
        volledigAdres:
          type: string
        straatnaam:
          type: string
        huisnummer:
          type: integer
          format: int32
        huisnummerToevoeging:
          type: string
        huisletter:
          type: string
        toevoegingAdres:
          type: string
        postcode:
          type: string
        postbusnummer:
