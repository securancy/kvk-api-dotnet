        volgorde:
          type: integer
          description: Het volgorde nummer van een handelsnaam
          example: 0
      description: Een handelsnaam is een naam waaronder een vestiging van een onderneming handelt.
    Naamgeving:
      required:
        - kvkNummer
      type: object
      properties:
        kvkNummer:
          type: string
          description: Nederlands Kamer van Koophandel nummer
          example: '59581883'
        rsin:
          pattern: '^[0-9]{9}$'
          type: string
          description: "RSIN (Rechtspersonen en Samenwerkingsverbanden Informatienummer)\n\nHet RSIN kan voorloopnullen bevatten\n"
          example: '823807071'
        statutaireNaam:
          type: string
          description: De naam van de rechtspersoon die opgenomen is in de oprichtingsakte
          example: Kamer van Koophandel
        naam:
          type: string
          description: Naam of eerste handelsnaam van de inschrijving
          example: Kamer van Koophandel
        ookGenoemd:
          type: string
          description: 'Een andere naam waaronder de vereniging, stichtingen en vereniging van eigenaars ook bekend is'
          example: Kamer van Koophandel
        startdatum:
          $ref: '#/components/schemas/Datum'
        einddatum:
          $ref: '#/components/schemas/Datum'
        vestigingen:
          type: array
          items:
            $ref: '#/components/schemas/Vestiging'
          description: Lijst van vestigingen
        _links:
          required:
            - self
            - basisprofiel
          type: object
          properties:
            self:
              $ref: '#/components/schemas/NaamgevingLink'
            basisprofiel:
              $ref: '#/components/schemas/NaamgevingLink'
          description: URI naar API Basisprofiel voor het huidige kvknummer
          example:
            - title: Basisprofiel
              href: https://api.kvk.nl/api/v1/basisprofielen/59581883
    CommercieleVestiging:
      required:
        - vestigingsnummer
      type: object
      properties:
        vestigingsnummer:
          pattern: '^[0-9]{12}$'
          type: string
          description: Uniek nummer dat bestaat uit 12 cijfers
          example: '000015063097'
        eersteHandelsnaam:
          type: string
          description: De eerste handelsnaam van de Vestiging
          example: Kamer van Koophandel
        handelsnamen:
          type: array
          items:
            $ref: '#/components/schemas/Handelsnaam'
          description: Alle namen waaronder een onderneming of vestiging handelt
        _links:
          required:
            - vestigingsprofiel
          type: object
          properties:
            vestigingsprofiel:
              $ref: '#/components/schemas/NaamgevingLink'
          description: URI naar API Vestigingsprofiel voor het huidige vestigingsnummer
          example:
            - title: Vestigingsprofiel
              href: https://api.kvk.nl/api/v1/vestigingsprofielen/000015063097
      description: Alle namen waaronder een vestiging handelt (op volgorde van registratie)
    NietCommercieleVestiging:
      required:
        - vestigingsnummer
      type: object
      properties:
        vestigingsnummer:
          pattern: '^[0-9]{12}$'
          type: string
          description: Uniek nummer dat bestaat uit 12 cijfers
          example: '000015063097'
        naam:
          type: string
          description: De naam van de Vestiging
        ookGenoemd:
          type: string
          description: 'Een andere naam waaronder de vereniging, stichtingen en vereniging van eigenaars ook bekend is'
        _links:
          required:
            - vestigingsprofiel
          type: object
          properties:
            vestigingsprofiel:
              $ref: '#/components/schemas/NaamgevingLink'
          description: URI naar API Vestigingsprofiel voor het huidige vestigingsnummer
          example:
            - title: Vestigingsprofiel
              href: https://api.kvk.nl/api/v1/vestigingsprofielen/000015063097
      description: De naam waaronder een niet commerciele vestiging bekend is
    Datum:
      type: string
      description: "In het handelsregister hebben we voor verschillende dossiers niet de exacte datums kunnen vastleggen.\nWe volgen hier de Handels Register datum vastlegging voor.\nHierdoor kan bij een onbekend deel van een datum nullen bevatten.\nBij een volledig bekende datum is het formaat YYYYMMDD ( Jaar maand dag),\nwaarbij alleen cijfers zijn toegestaan, inclusief de 0 voor onbekende delen van de datum.\n\n__Mogelijke formaten van waarden__\n\n| Type            | Formaat   |\n| --------------- | --------- |\n| Volledige datum | 20150622  |\n| Dag onbekend    | 20150600  |\n| Maand onbekend  | 20150012  |\n| Datum onbekend  | 00000000  |\n"
      example: '20220421'
